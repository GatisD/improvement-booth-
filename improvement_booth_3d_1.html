<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Improvement - Exhibition Booth 3D Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;overflow:hidden;font-family:-apple-system,sans-serif;color:#fff}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:10px 24px;border-radius:8px;font-size:13px;color:#888;pointer-events:none;z-index:10;white-space:nowrap}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;color:#666;z-index:20;text-align:center}
#loading .spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#8BC34A;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
#loading .count{font-size:13px;color:#555;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{display:block}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div>Ielādē paneļus...<div class="count" id="loadCount">0 / 10</div></div>
<div id="info">Velc, lai grieztu · Scroll, lai tuvinātu</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const panelImages = [
// Kreisā siena (1-3)
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/2@0.5x-100.jpg',  // Smiltis
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/1@0.5x-100.jpg',  // Melnzeme
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/3@0.5x-100.jpg',  // Šķemba
// Aizmugurējā siena (4-7)
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/6@0.5x-100.jpg',  // Granīta šķemba
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/4@0.5x-100.jpg',  // Oļi
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/5@0.5x-100.jpg',  // Asfalts
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/7@0.5x-100.jpg',  // Drupināts betons
// Labā siena (8-10)
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/10@0.5x-100.jpg', // Bruģis
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/8@0.5x-100.jpg',  // Apzaļumošana
'https://raw.githubusercontent.com/GatisD/improvement-booth-/main/9@0.5x-100.jpg'   // Ceļu būve
];

const PW=1.0,PH=2.5;
let scene,camera,renderer,isDragging=false,previousMousePosition={x:0,y:0};
let rotationY=-0.6,rotationX=0.35,targetRotationY=rotationY,targetRotationX=rotationX;
let cameraDistance=7.5,targetDistance=7.5,boothGroup,loadedCount=0;

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1a1a);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const kl=new THREE.DirectionalLight(0xffffff,0.6);kl.position.set(4,6,5);scene.add(kl);
  const fl=new THREE.DirectionalLight(0xf0f0ff,0.3);fl.position.set(-4,5,4);scene.add(fl);
  const rl=new THREE.DirectionalLight(0xffffff,0.2);rl.position.set(0,3,-5);scene.add(rl);
  const bl=new THREE.PointLight(0xffffff,0.3,10);bl.position.set(0,2,-1);scene.add(bl);

  boothGroup=new THREE.Group();
  scene.add(boothGroup);

  // Floor
  const fm=new THREE.Mesh(new THREE.PlaneGeometry(7,5),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.3,metalness:0.5}));
  fm.rotation.x=-Math.PI/2;fm.position.set(0,0,-0.5);boothGroup.add(fm);

  const loader=new THREE.TextureLoader();
  const bw=4*PW,sd=3*PW,cfgs=[];

  // LEFT WALL: 3 panels (1-3), facing +X
  for(let i=0;i<3;i++)cfgs.push({idx:i,x:-bw/2,y:PH/2,z:-sd+PW/2+i*PW,rotY:Math.PI/2});
  // BACK WALL: 4 panels (4-7), facing +Z
  for(let i=0;i<4;i++)cfgs.push({idx:3+i,x:-bw/2+PW/2+i*PW,y:PH/2,z:-sd,rotY:0});
  // RIGHT WALL: 3 panels (8-10), facing -X
  for(let i=0;i<3;i++)cfgs.push({idx:7+i,x:bw/2,y:PH/2,z:-sd+PW/2+i*PW,rotY:-Math.PI/2});

  cfgs.forEach(c=>{
    loader.load(panelImages[c.idx],tex=>{
      tex.encoding=THREE.sRGBEncoding;
      tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
      tex.minFilter=THREE.LinearMipmapLinearFilter;
      tex.magFilter=THREE.LinearFilter;
      const m=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:0.4,metalness:0}));
      m.position.set(c.x,c.y,c.z);m.rotation.y=c.rotY;boothGroup.add(m);
      // Backing
      const bk=new THREE.Mesh(new THREE.BoxGeometry(PW,PH,0.03),new THREE.MeshStandardMaterial({color:0x222222,roughness:0.8}));
      bk.position.set(c.x,c.y,c.z);bk.rotation.y=c.rotY;
      const off=new THREE.Vector3(0,0,-0.016).applyAxisAngle(new THREE.Vector3(0,1,0),c.rotY);
      bk.position.add(off);boothGroup.add(bk);
      loadedCount++;
      document.getElementById('loadCount').textContent=loadedCount+' / 10';
      if(loadedCount>=10)document.getElementById('loading').style.display='none';
    },undefined,()=>{loadedCount++;document.getElementById('loadCount').textContent=loadedCount+' / 10';if(loadedCount>=10)document.getElementById('loading').style.display='none';});
  });

  // Aluminum profiles
  const pm=new THREE.MeshStandardMaterial({color:0x666666,metalness:0.8,roughness:0.3});
  // Back joints
  for(let i=1;i<4;i++){const j=new THREE.Mesh(new THREE.BoxGeometry(0.015,PH,0.035),pm);j.position.set(-bw/2+i*PW,PH/2,-sd);boothGroup.add(j);}
  // Left joints
  for(let i=1;i<3;i++){const j=new THREE.Mesh(new THREE.BoxGeometry(0.035,PH,0.015),pm);j.position.set(-bw/2,PH/2,-sd+i*PW);boothGroup.add(j);}
  // Right joints
  for(let i=1;i<3;i++){const j=new THREE.Mesh(new THREE.BoxGeometry(0.035,PH,0.015),pm);j.position.set(bw/2,PH/2,-sd+i*PW);boothGroup.add(j);}
  // Corners
  const cg=new THREE.BoxGeometry(0.035,PH,0.035);
  const cl=new THREE.Mesh(cg,pm);cl.position.set(-bw/2,PH/2,-sd);boothGroup.add(cl);
  const cr=new THREE.Mesh(cg.clone(),pm);cr.position.set(bw/2,PH/2,-sd);boothGroup.add(cr);
  // Top rails
  const trm=new THREE.MeshStandardMaterial({color:0x555555,metalness:0.7,roughness:0.3});
  const tb=new THREE.Mesh(new THREE.BoxGeometry(bw+0.04,0.025,0.04),trm);tb.position.set(0,PH,-sd);boothGroup.add(tb);
  const tl=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.025,sd+0.04),trm);tl.position.set(-bw/2,PH,-sd/2);boothGroup.add(tl);
  const tr=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.025,sd+0.04),trm);tr.position.set(bw/2,PH,-sd/2);boothGroup.add(tr);

  boothGroup.position.set(0,-PH/2,sd/2);

  renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;previousMousePosition={x:e.clientX,y:e.clientY};});
  renderer.domElement.addEventListener('mousemove',e=>{if(!isDragging)return;targetRotationY+=(e.clientX-previousMousePosition.x)*0.005;targetRotationX+=(e.clientY-previousMousePosition.y)*0.005;targetRotationX=Math.max(-1.2,Math.min(1.2,targetRotationX));previousMousePosition={x:e.clientX,y:e.clientY};});
  renderer.domElement.addEventListener('mouseup',()=>isDragging=false);
  renderer.domElement.addEventListener('mouseleave',()=>isDragging=false);
  renderer.domElement.addEventListener('wheel',e=>{targetDistance+=e.deltaY*0.004;targetDistance=Math.max(3.5,Math.min(15,targetDistance));},{passive:true});
  
  let lastTD=0;
  renderer.domElement.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===1){isDragging=true;previousMousePosition={x:e.touches[0].clientX,y:e.touches[0].clientY};}else if(e.touches.length===2){lastTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:false});
  renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&isDragging){targetRotationY+=(e.touches[0].clientX-previousMousePosition.x)*0.005;targetRotationX+=(e.touches[0].clientY-previousMousePosition.y)*0.005;targetRotationX=Math.max(-1.2,Math.min(1.2,targetRotationX));previousMousePosition={x:e.touches[0].clientX,y:e.touches[0].clientY};}else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);targetDistance+=(lastTD-d)*0.02;targetDistance=Math.max(3.5,Math.min(15,targetDistance));lastTD=d;}},{passive:false});
  renderer.domElement.addEventListener('touchend',()=>isDragging=false);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  animate();
}

function animate(){
  requestAnimationFrame(animate);
  rotationY+=(targetRotationY-rotationY)*0.08;
  rotationX+=(targetRotationX-rotationX)*0.08;
  cameraDistance+=(targetDistance-cameraDistance)*0.08;
  camera.position.x=Math.sin(rotationY)*Math.cos(rotationX)*cameraDistance;
  camera.position.y=Math.sin(rotationX)*cameraDistance;
  camera.position.z=Math.cos(rotationY)*Math.cos(rotationX)*cameraDistance;
  camera.lookAt(0,0.2,-0.3);
  renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
